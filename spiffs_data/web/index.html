<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="app-shell">
    <aside id="sessionSidebar" class="session-sidebar" aria-label="会话列表">
      <div class="session-head">
        <div>
          <div class="session-kicker">AGENT</div>
          <h1>会话</h1>
        </div>
        <button id="newSessionBtn" class="new-session-btn" type="button" aria-label="新建会话">+</button>
      </div>
      <div id="sessionList" class="session-list" aria-live="polite"></div>
    </aside>
    <section class="chat-shell">
      <header class="topbar">
        <div class="topbar-actions">
          <div class="status-chip" aria-live="polite">
            <span id="dot" class="dot"></span>
            <span id="status">未连接</span>
          </div>
          <div class="agent-state-row" id="agentStateRow" aria-live="polite">
            <span id="agentIntentTag" class="agent-tag" hidden aria-hidden="true">
              <span class="agent-tag-icon"></span>
              <span class="agent-tag-label"></span>
            </span>
            <span id="agentRoleTag" class="agent-tag role-tag" hidden aria-hidden="true">
              <span class="agent-tag-label"></span>
            </span>
          </div>
          <label class="theme-control" aria-label="Theme">
            <span>主题</span>
            <select id="themeSelect" class="theme-switch" aria-label="Theme">
              <option value="warm">暖光</option>
              <option value="mist">雾蓝</option>
              <option value="plain">素白</option>
            </select>
          </label>
          <label class="security-control" aria-label="终端安全等级">
            <span>模式</span>
            <select id="terminalSecuritySelect" class="security-switch" aria-label="终端安全等级">
              <option value="plan">Plan</option>
              <option value="build">Build</option>
            </select>
          </label>
          <button id="selfTestBtn" class="self-test-btn" type="button" title="运行自检">🔍 自检</button>
        </div>
      </header>
      <script>
        document.addEventListener('DOMContentLoaded', function() {
          var btn = document.getElementById('selfTestBtn');
          if (btn) {
            btn.addEventListener('click', function() {
              var input = document.getElementById('input');
              if (input) { input.value = '!test'; input.dispatchEvent(new Event('input', {bubbles:true})); }
              var send = document.getElementById('sendBtn');
              if (send) send.click();
            });
          }
        });
      </script>

      <section class="thread-card">
        <div class="viewport">
          <div id="messages" class="messages" aria-live="polite"></div>
          <button
            id="scrollToBottom"
            class="scroll-bottom"
            type="button"
            aria-label="Scroll to latest messages"
            hidden
          >
            ↓
          </button>
        </div>

        <form id="composer" class="composer">
          <div class="empty-hero">
            <h2 class="empty-title">AGENT</h2>
          </div>
          <div class="composer-frame">
            <div id="attachmentPreview" class="attachment-preview" hidden>
              <img id="attachmentImage" class="attachment-image" alt="已粘贴的图片" />
              <span id="attachmentName" class="attachment-name"></span>
              <button id="attachmentRemove" type="button" aria-label="移除图片" title="移除图片">×</button>
            </div>
            <div class="composer-row">
              <textarea
                id="input"
                rows="1"
                placeholder="有问题，尽管问"
                aria-label="Message input"
              ></textarea>
              <button
                id="sendBtn"
                class="send-btn"
                type="submit"
                aria-label="Send message"
                title="Send message"
              >发送</button>
            </div>
            <div class="actions">
              <span id="ctxBadge" class="context-badge">
                <strong>加载中</strong>
                <span>上下文统计...</span>
              </span>
              <span class="hint">Enter 发送，Shift + Enter 换行</span>
            </div>
          </div>
        </form>
      </section>
      <p class="ai-disclaimer">内容由AI生成，请仔细甄别</p>
    </section>
  </main>

  <div id="interactiveModal" class="sudo-modal">
    <div class="sudo-card">
      <div id="interactiveTitle" class="sudo-title">需要授权</div>
      <div id="interactivePrompt" class="sudo-body">命令需要提升权限。</div>
      <input id="interactiveInput" class="sudo-input" type="password" placeholder="输入 sudo 密码" />
      <div class="sudo-actions">
        <button id="interactiveCancel" type="button" class="ghost-btn">取消</button>
        <button id="interactiveSubmit" type="button">继续</button>
      </div>
    </div>
  </div>

  <aside id="coordinatorPanel" class="coordinator-panel" hidden aria-hidden="true">
    <div class="coordinator-head">
      <div class="coordinator-head-copy">
        <span class="coordinator-title">Coordinator</span>
        <span class="coordinator-summary">等待子任务</span>
      </div>
      <button id="coordinatorClose" class="coordinator-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="coordinator-layout">
      <div id="coordinatorAgents" class="coordinator-agents"></div>
    </div>
  </aside>

  <aside id="subagentDetailPanel" class="subagent-detail-panel" hidden aria-hidden="true">
    <div class="subagent-detail-head">
      <div class="subagent-detail-copy">
        <span id="subagentDetailTitle" class="subagent-detail-title">Subagent</span>
        <span id="subagentDetailMeta" class="subagent-detail-meta">等待选择子任务</span>
      </div>
    </div>
    <div id="subagentSessionRail" class="subagent-session-rail" aria-label="子会话列表"></div>
    <div id="subagentDetailTabs" class="subagent-detail-tabs" role="tablist" aria-label="子任务详情标签"></div>
    <div id="subagentDetailBlockers" class="subagent-detail-blockers"></div>
    <div id="subagentDetailFrames" class="subagent-detail-frames"></div>
    <div id="subagentDetailOutput" class="subagent-detail-output"></div>
  </aside>

  <aside id="petDock" class="pet-dock" hidden aria-hidden="true">
    <div id="petChooser" class="pet-chooser" hidden aria-hidden="true">
      <button
        id="petChooserButton"
        class="pet-chooser-button"
        type="button"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-label="切换宠物"
      >
        <span class="pet-chooser-kicker">Pet</span>
        <span id="petChooserLabel" class="pet-chooser-label">咕嘎</span>
        <span class="pet-chooser-caret">⌄</span>
      </button>
      <div id="petChooserMenu" class="pet-chooser-menu" role="listbox" hidden></div>
    </div>
    <div class="pet-stage">
      <div id="petBubble" class="pet-bubble" hidden aria-hidden="true"></div>
      <button id="petButton" class="pet-button" type="button" aria-label="Play pet animation">
        <div id="petRunner" class="pet-runner">
          <div id="petSprite" class="pet-sprite" role="img" aria-label="Agent pet"></div>
        </div>
      </button>
    </div>
  </aside>

  <div id="reconnectToast" class="reconnect-toast" hidden aria-hidden="true">
    <span class="reconnect-toast-icon">↻</span>
    <span id="reconnectToastText">正在恢复会话...</span>
    <button id="reconnectToastAction" class="reconnect-toast-action" type="button">恢复</button>
  </div>

  <script src="/pet.js"></script>
  <script src="/subagent-state-core.js"></script>
  <script src="/subagent-state-selectors.js"></script>
  <script src="/subagent-state-reducer.js"></script>
  <script src="/subagent-state.js"></script>
  <script src="/subagent-runtime.js"></script>
  <script src="/subagent-app-bridge.js"></script>
  <script src="/subagent-panel-controller.js"></script>
  <script src="/subagent-detail-view.js"></script>
  <script src="/subagent-event-adapter.js"></script>
  <script src="/subagent-interactive-controller.js"></script>
  <script src="/subagent-coordinator-view.js"></script>
  <script src="/subagent-coordinator-controller.js"></script>
  <script src="/subagent-ui-orchestrator.js"></script>
  <script src="/subagent-transport.js"></script>
  <script src="/subagent-chat-transport.js"></script>
  <script src="/subagent-bootstrap.js"></script>
  <script src="/app.js"></script>
</body>
</html>
