<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent</title>
  <link rel="stylesheet" href="/app.css" />
  <script>
    (function() {
      var origSend = WebSocket.prototype.send;
      WebSocket.prototype.send = function(data) {
        try {
          var obj = JSON.parse(data);
          if (obj.type === 'message') {
            if (!obj.agent_id) {
              obj.agent_id = localStorage.getItem('agent_id') || 'boss';
            }
          }
          data = JSON.stringify(obj);
        } catch(e) {}
        return origSend.call(this, data);
      };
    })();
  </script>
</head>
<body>
  <main class="app-shell">
    <aside id="sessionSidebar" class="session-sidebar" aria-label="会话列表">
      <div class="session-head">
        <div>
          <div class="session-kicker">AGENT</div>
          <h1>会话</h1>
        </div>
        <button id="newSessionBtn" class="new-session-btn" type="button" aria-label="新建会话">+</button>
      </div>
      <div id="sessionList" class="session-list" aria-live="polite"></div>
    </aside>
    <section class="chat-shell">
      <header class="topbar">
        <div class="topbar-actions">
          <div class="status-chip" aria-live="polite">
            <span id="dot" class="dot"></span>
            <span id="status">连接中</span>
          </div>
          <label class="theme-control" aria-label="选择角色">
            <span>角色</span>
            <select id="agentSelect" class="theme-switch" aria-label="选择角色">
              <option value="boss">Boss</option>
              <option value="hr">HR</option>
            </select>
          </label>
          <label class="theme-control" aria-label="Theme">
            <span>主题</span>
            <select id="themeSelect" class="theme-switch" aria-label="Theme">
              <option value="warm">暖光</option>
              <option value="mist">雾蓝</option>
              <option value="plain">素白</option>
            </select>
          </label>
          <label class="security-control" aria-label="终端安全等级">
            <span>模式</span>
            <select id="terminalSecuritySelect" class="security-switch" aria-label="终端安全等级">
              <option value="plan">Plan</option>
              <option value="build">Build</option>
            </select>
          </label>
          <button id="hrScanBtn" class="self-test-btn" type="button" title="HR 扫描蒸馏">🧠 HR</button>
        </div>
      </header>

      <section id="agentDetail" class="agent-detail" hidden aria-hidden="true">
        <div class="agent-detail-head">
          <h3 id="agentDetailName">Agent</h3>
          <div>
            <button id="agentDeleteBtn" class="agent-delete-btn" type="button" aria-label="删除角色">删除</button>
            <button id="agentDetailClose" class="agent-detail-close" type="button" aria-label="关闭详情">×</button>
          </div>
        </div>
        <div class="agent-detail-body">
          <div class="agent-detail-field">
            <label>工具 (toolset)</label>
            <div id="agentToolsetTags" class="tag-list"></div>
            <form id="agentAddToolForm" class="tag-add-form">
              <input id="agentAddToolInput" class="tag-add-input" placeholder="+ 添加工具" autocomplete="off" />
            </form>
          </div>
          <div class="agent-detail-field">
            <label>核心技能 (core_skills)</label>
            <div id="agentCoreSkillsTags" class="tag-list"></div>
            <form id="agentAddSkillForm" class="tag-add-form">
              <input id="agentAddSkillInput" class="tag-add-input" placeholder="+ 添加技能" autocomplete="off" />
            </form>
          </div>
        </div>
      </section>

      <script>
        document.addEventListener('DOMContentLoaded', function() {
          var hrScanBtn = document.getElementById('hrScanBtn');
          if (hrScanBtn) {
            hrScanBtn.addEventListener('click', function() {
              var input = document.getElementById('input');
              if (input) {
                input.value = 'hr scan --auto';
                input.dispatchEvent(new Event('input', {bubbles:true}));
              }
              var send = document.getElementById('sendBtn');
              if (send) send.click();
            });
          }

          var agentSelect = document.getElementById('agentSelect');
          if (agentSelect) {
            agentSelect.addEventListener('change', function() {
              localStorage.setItem('agent_id', agentSelect.value);
              /* 触发详情面板刷新 */
              if (typeof window._onAgentSelectChange === 'function') {
                window._onAgentSelectChange(agentSelect.value);
              }
            });
            var saved = localStorage.getItem('agent_id');
            if (saved) agentSelect.value = saved;
          }
        });
      </script>

      <section class="thread-card">
        <div class="viewport">
          <div id="messages" class="messages" aria-live="polite"></div>
          <button
            id="scrollToBottom"
            class="scroll-bottom"
            type="button"
            aria-label="Scroll to latest messages"
            hidden
          >
            ↓
          </button>
        </div>

        <form id="composer" class="composer">
          <div class="empty-hero">
            <h2 class="empty-title">AGENT</h2>
          </div>
          <div class="composer-frame">
            <div id="attachmentPreview" class="attachment-preview" hidden>
              <img id="attachmentImage" class="attachment-image" alt="已粘贴的图片" />
              <span id="attachmentName" class="attachment-name"></span>
              <button id="attachmentRemove" type="button" aria-label="移除图片" title="移除图片">×</button>
            </div>
            <div class="composer-row">
              <textarea
                id="input"
                rows="1"
                placeholder="有问题，尽管问"
                aria-label="Message input"
              ></textarea>
              <button
                id="sendBtn"
                class="send-btn"
                type="submit"
                aria-label="Send message"
                title="Send message"
              >发送</button>
            </div>
            <div class="actions">
              <span id="ctxBadge" class="context-badge">
                <strong>加载中</strong>
                <span>上下文统计...</span>
              </span>
              <span class="hint">Enter 发送，Shift + Enter 换行</span>
            </div>
          </div>
        </form>
      </section>
      <p class="ai-disclaimer">内容由AI生成，请仔细甄别</p>
    </section>
  </main>

  <div id="interactiveModal" class="sudo-modal">
    <div class="sudo-card">
      <div id="interactiveTitle" class="sudo-title">需要授权</div>
      <div id="interactivePrompt" class="sudo-body">命令需要提升权限。</div>
      <input id="interactiveInput" class="sudo-input" type="password" placeholder="输入 sudo 密码" />
      <div class="sudo-actions">
        <button id="interactiveCancel" type="button" class="ghost-btn">取消</button>
        <button id="interactiveSubmit" type="button">继续</button>
      </div>
    </div>
  </div>

  <aside id="petDock" class="pet-dock" hidden aria-hidden="true">
    <div id="petChooser" class="pet-chooser" hidden aria-hidden="true">
      <button
        id="petChooserButton"
        class="pet-chooser-button"
        type="button"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-label="切换宠物"
      >
        <span class="pet-chooser-kicker">Pet</span>
        <span id="petChooserLabel" class="pet-chooser-label">咕嘎</span>
        <span class="pet-chooser-caret">⌄</span>
      </button>
      <div id="petChooserMenu" class="pet-chooser-menu" role="listbox" hidden></div>
    </div>
    <div class="pet-stage">
      <div id="petBubble" class="pet-bubble" hidden aria-hidden="true"></div>
      <button id="petButton" class="pet-button" type="button" aria-label="Play pet animation">
        <div id="petRunner" class="pet-runner">
          <div id="petSprite" class="pet-sprite" role="img" aria-label="Agent pet"></div>
        </div>
      </button>
    </div>
  </aside>

  <div id="retireModal" class="sudo-modal" hidden aria-hidden="true">
    <div class="sudo-card" style="max-width:420px;">
      <div class="sudo-title">删除角色</div>
      <div class="sudo-body" id="retirePrompt">确定要删除此角色吗？</div>
      <label style="display:block;margin:0 0 8px;font-size:0.85em;color:var(--muted,#999);">
        交接给
        <select id="retireTargetSelect" style="width:100%;margin-top:4px;padding:6px 10px;border-radius:8px;border:1px solid var(--border,#ddd);background:var(--surface,#fff);color:var(--text,#333);"></select>
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:0.85em;">
        <input type="checkbox" id="retireTransferSkills" checked /> 交接所有技能 (skills)
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:0.85em;">
        <input type="checkbox" id="retireTransferTools" checked /> 交接所有工具 (tools)
      </label>
      <div class="sudo-actions">
        <button id="retireCancel" type="button" class="ghost-btn">取消</button>
        <button id="retireConfirm" type="button" style="background:#e74c3c;color:#fff;">确认删除</button>
      </div>
    </div>
  </div>

  <div id="reconnectToast" class="reconnect-toast" hidden aria-hidden="true">
    <span class="reconnect-toast-icon">↻</span>
    <span id="reconnectToastText">正在恢复会话...</span>
    <button id="reconnectToastAction" class="reconnect-toast-action" type="button">恢复</button>
  </div>

  <script>
    /* 诊断：5 秒后如果还没连上，在页面显示排查信息 */
    setTimeout(function() {
      var st = document.getElementById('status');
      var dot = document.getElementById('dot');
      if (st && st.textContent === '连接中') {
        st.textContent = '未连接 · 请检查';
        dot.className = 'dot';
        var msgs = document.getElementById('messages');
        if (msgs && !msgs.querySelector('.ws-diag')) {
          var div = document.createElement('div');
          div.className = 'ws-diag';
          var wsUrl = 'ws://' + location.host + '/ws';
          div.innerHTML = '<div class="msg-body" style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px;margin:8px;font-size:0.9em;">'
            + '<strong>⚠ 无法连接到 Agent</strong><br><br>'
            + '<b>WebSocket:</b> <code>' + wsUrl + '</code><br>'
            + '<b>HTTP API:</b> <code id="diagApi"></code><br><br>'
            + '<b>可能原因:</b><br>'
            + '1. Agent 进程未运行 → 执行 <code>~/.agent-data/bin/agent &</code><br>'
            + '2. 端口被占用 → <code>ss -tlnp | grep 1234</code><br>'
            + '3. 浏览器缓存旧文件 → <b>Ctrl+Shift+R 强制刷新</b><br>'
            + '4. 浏览器拦截 WebSocket → 检查扩展/防火墙<br>'
            + '</div>';
          msgs.appendChild(div);
          /* 测试 HTTP API */
          fetch('/api/agents').then(function(r) {
            var el = document.getElementById('diagApi');
            if (el) el.textContent = '/api/agents → ' + (r.ok ? '✅ 可达' : '❌ ' + r.status);
          }).catch(function() {
            var el = document.getElementById('diagApi');
            if (el) el.textContent = '/api/agents → ❌ 请求失败';
          });
        }
      }
    }, 5000);
  </script>
  <script>
    /* 直接建立 WebSocket 连接，不依赖 app.js */
    (function() {
      var chatId = localStorage.getItem('agent_chat_id') || 'web_' + Math.random().toString(36).slice(2,8);
      var url = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws?chat_id=' + chatId;
      var st = document.getElementById('status');
      var dot = document.getElementById('dot');
      if (st) st.textContent = '连接中';
      var ws = new WebSocket(url);
      ws.onopen = function() {
        if (st) st.textContent = '已连接';
        if (dot) dot.className = 'dot on';
      };
      ws.onclose = function() {
        if (st) st.textContent = '未连接';
        if (dot) dot.className = 'dot';
      };
      ws.onerror = function() {
        if (st) st.textContent = '未连接';
        if (dot) dot.className = 'dot';
      };
      ws.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data);
          var el = document.getElementById('messages');
          if (!el) return;
          if (msg.type === 'response' && msg.content) {
            var div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = '<div class="msg-body"><div class="msg-text">' +
              msg.content.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') +
              '</div></div>';
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
          } else if (msg.type === 'tool' && msg.content) {
            var tdiv = document.createElement('div');
            tdiv.className = 'message tool';
            tdiv.innerHTML = '<div class="msg-body" style="opacity:0.7;font-size:0.85em;">' +
              msg.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
            el.appendChild(tdiv);
            el.scrollTop = el.scrollHeight;
          } else if (msg.type === 'error' && msg.content) {
            var ediv = document.createElement('div');
            ediv.className = 'message error';
            ediv.innerHTML = '<div class="msg-body" style="color:#e74c3c;">' +
              msg.content.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
            el.appendChild(ediv);
            el.scrollTop = el.scrollHeight;
          }
        } catch(_) {}
      };
      window._bootstrapWs = ws;
      window._bootstrapChatId = chatId;
    })();
  </script>
  <script src="/pet.js"></script>
  <script src="/session-restore.js"></script>
  <script src="/session-state-runtime.js"></script>
  <script src="/connection-state-presenter.js"></script>
  <script src="/reconnect-controller.js"></script>
  <script src="/app.js"></script>
</body>
</html>
